apiVersion: v1
kind: Pod
metadata:
  name: warp-results-reader
  namespace: noobaa-benchmark
  labels:
    app: warp-results-reader
spec:
  restartPolicy: Never

  securityContext:
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: reader
      image: registry.access.redhat.com/ubi9/ubi:latest
      imagePullPolicy: IfNotPresent

      command:
        - /bin/bash
        - -c
        - sleep infinity

      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi

      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL

      volumeMounts:
        - name: results
          mountPath: /results
          readOnly: true

  volumes:
    - name: results
      persistentVolumeClaim:
        claimName: warp-results
