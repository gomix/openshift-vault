apiVersion: batch/v1
kind: Job
metadata:
  name: 00-mini-smoke
  namespace: noobaa-benchmark
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300

  template:
    metadata:
      labels:
        app: noobaa-warp
        test: 00-mini-smoke

    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 60

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: warp
          image: minio/warp:latest
          imagePullPolicy: Always

          command:
            - /bin/sh
            - -c

          args:

            - |
              TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
              exec /warp mixed \
                --host=s3.openshift-storage.svc:443 \
                --tls \
                --insecure \
                --access-key="${AWS_ACCESS_KEY_ID}" \
                --secret-key="${AWS_SECRET_ACCESS_KEY}" \
                --bucket="${BUCKET_NAME}" \
                --warp-client=warp-client:7761  \
                --duration=1m \
                --concurrent=2 \
                --rps-limit=2 \
                --objects=20 \
                --obj.size=256KiB \
                --get-distrib=45 \
                --stat-distrib=30 \
                --put-distrib=15 \
                --delete-distrib=10 \
                --analyze.v \
                --benchdata="/results/${TIMESTAMP}-${WARP_RUN_ID}"
          env:
            - name: WARP_RUN_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: noobaa-warp-benchmark
                  key: AWS_ACCESS_KEY_ID

            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: noobaa-warp-benchmark
                  key: AWS_SECRET_ACCESS_KEY

            - name: BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: noobaa-warp-benchmark
                  key: BUCKET_NAME

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: results
              mountPath: /results

      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: warp-results
